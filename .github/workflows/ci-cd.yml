name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies for mysqlclient
      run: |
        sudo apt-get update
        sudo apt-get install -y default-libmysqlclient-dev pkg-config gcc

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with SQLite
      run: |
        pytest --cov=libros --cov=usuarios --cov=auditoria --cov-report=xml --cov-report=html
      env:
        SECRET_KEY: ci-secret-key-only-for-testing
        DEBUG: 'True'
        ALLOWED_HOSTS: 'localhost,127.0.0.1'
        USE_SQLITE: 'True'

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/
